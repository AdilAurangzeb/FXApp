name = "visa-worker"
main = "src/index.js"
compatibility_date = "2026-01-01"
workers_dev = false          # keep it private; only the Pages project can call it

[vars]
VISA_BASE = "https://sandbox.api.visa.com"   # switch to https://api.visa.com once Visa approves production
VISA_RATE_PRODUCT = "A"                      # A, B, BANK or WALLET - whatever your Visa project is enrolled for
VISA_BIN = "0"                               # your acquiring BIN (A/B) or initiating party id (BANK/WALLET)

[[mtls_certificates]]
binding = "VISA_CERT"
certificate_id = "PASTE_ID_FROM_WRANGLER_UPLOAD"
