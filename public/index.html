<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Travel FX">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Travel FX</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --line: #334155;
    --text: #f1f5f9; --muted: #94a3b8; --accent: #38bdf8; --warn: #fbbf24;
    --visa: #1d4ed8;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f1f5f9; --card: #ffffff; --line: #e2e8f0; --text: #0f172a; --muted: #64748b; --accent: #0284c7; --warn: #b45309; --visa: #1d4ed8; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; width: 100%; height: 100%; overflow-x: hidden; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body {
    min-height: 100dvh; display: flex; justify-content: center;
    padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
  }
  main {
    width: 100%; max-width: 720px; min-width: 0;
    display: grid; grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto auto minmax(0, 1fr) auto;
    gap: 12px; min-height: calc(100dvh - 28px);
  }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 14px 16px; min-width: 0; }
  .row { display: flex; gap: 12px; align-items: center; min-width: 0; }
  input, select { font: inherit; color: var(--text); background: transparent; border: 0; outline: 0; min-width: 0; }
  input { caret-color: var(--accent); font-variant-numeric: tabular-nums; padding: 0; }
  #amount { flex: 1 1 0; width: 100%; font-size: 3.5rem; font-weight: 700; }
  select { flex: 0 0 auto; font-size: 1.3rem; font-weight: 700; background: var(--bg); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 10px; color: var(--text); }
  .swap { display: flex; justify-content: center; margin: -4px 0; }
  button { font: inherit; color: var(--accent); background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; width: 48px; height: 48px; font-size: 1.4rem; cursor: pointer; }
  .label { color: var(--muted); font-size: .85rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }

  #results { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .result { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 14px 16px;
    display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  .result.market { flex: 1 1 0; min-height: 150px; justify-content: space-between; }
  .result.visa { flex: 0 0 auto; border-color: var(--visa); box-shadow: inset 0 0 0 1px var(--visa); gap: 4px; }
  .rhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .est { color: var(--warn); font-size: .75rem; font-weight: 700; margin-left: 8px; }
  .big { display: flex; align-items: center; flex: 1; min-width: 0; }
  .value { width: 100%; font-weight: 800; line-height: 1.05; letter-spacing: -.02em; }
  #v-market { font-size: 120px; }
  #v-visa { font-size: 56px; font-weight: 700; }
  .rfoot { color: var(--muted); font-size: .85rem; min-height: 1.1em; }
  #status { color: var(--muted); font-size: .78rem; text-align: center; min-height: 1.2em; }
  #status.err { color: var(--warn); }
  .dim { opacity: .45; transition: opacity .15s; }
</style>
</head>
<body>
<main>
  <section class="card">
    <div class="row">
      <input id="amount" type="text" inputmode="decimal" autocomplete="off" value="15" aria-label="Amount">
      <select id="from" aria-label="From currency"></select>
    </div>
  </section>

  <div class="swap"><button id="swap" aria-label="Swap currencies">⇅</button></div>

  <section class="card">
    <div class="row" style="justify-content:space-between">
      <span class="label">Convert to</span>
      <select id="to" aria-label="To currency"></select>
    </div>
  </section>

  <section id="results">
    <div class="result market">
      <div class="rhead"><span class="label">Market</span><span class="label" id="c-market"></span></div>
      <div class="big"><input class="value" id="v-market" type="text" inputmode="decimal" autocomplete="off" placeholder="–" aria-label="Market rate amount"></div>
      <div class="rfoot" id="f-market"></div>
    </div>
    <!-- Mastercard disabled (sandbox rates are simulated). To restore, add a card here like the Visa one. -->
    <div class="result visa">
      <div class="rhead"><span class="label">Visa<span class="est" id="e-visa" hidden>EST.</span></span><span class="label" id="c-visa"></span></div>
      <input class="value" id="v-visa" type="text" inputmode="decimal" autocomplete="off" placeholder="–" aria-label="Visa rate amount">
      <div class="rfoot" id="f-visa"></div>
    </div>
  </section>

  <div id="status"></div>
</main>

<script>
const CURRENCIES = ['GBP', 'USD', 'EUR', 'PKR', 'EGP'];
const $ = (id) => document.getElementById(id);
const amountEl = $('amount'), fromEl = $('from'), toEl = $('to'), statusEl = $('status');
const marketEl = $('v-market'), visaEl = $('v-visa');
const REFRESH_MS = 60_000;

let rates = null;
let reqId = 0;

const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} },
};

const parseNum = (s) => {
  const n = parseFloat(String(s).replace(/,/g, '').replace(/[^0-9.]/g, ''));
  return Number.isFinite(n) ? n : 0;
};
const fmt2 = (n) => n.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtBase = (n) => (n > 0 && n < 0.1 ? n.toFixed(4) : n.toFixed(2));

for (const c of CURRENCIES) { fromEl.add(new Option(c, c)); toEl.add(new Option(c, c)); }
fromEl.value = store.get('from', 'GBP');
toEl.value = store.get('to', 'EGP');
amountEl.value = store.get('amount', '15');

// base = the amount in the FROM currency. Every field is derived from it.
let base = parseNum(amountEl.value);

// Shrink-to-fit for inputs: start at max size, reduce until the text fits.
function fitInput(el, maxPx, minPx = 18) {
  let size = maxPx, guard = 0;
  el.style.fontSize = size + 'px';
  while (el.scrollWidth > el.clientWidth && size > minPx && guard++ < 80) {
    size = Math.max(minPx, size * Math.min(0.96, el.clientWidth / el.scrollWidth));
    el.style.fontSize = size + 'px';
  }
}
function fitAll() {
  fitInput(amountEl, 64, 22);
  const h = marketEl.parentElement.clientHeight || 160;
  fitInput(marketEl, Math.min(h * 0.9, 190), 22);
  fitInput(visaEl, 56, 20);
}

// Write into a field unless the person is typing in it right now.
function setField(el, text) { if (document.activeElement !== el) el.value = text; }

// source = the field the person just edited ('amount' | 'market' | 'visa' | null)
function render(source) {
  if (!rates) return;
  const to = toEl.value;
  if (source === 'market' || source === 'visa') setField(amountEl, fmtBase(base));
  setField(marketEl, fmt2(base * rates.market));
  setField(visaEl, fmt2(base * rates.visa));
  for (const [key, rate] of [['market', rates.market], ['visa', rates.visa]]) {
    $('c-' + key).textContent = to;
    let foot = `1 ${fromEl.value} = ${rate.toLocaleString('en-GB', { maximumFractionDigits: 4 })} ${to}`;
    if (key === 'visa' && rates.market) {
      const pct = (rate / rates.market - 1) * 100;
      foot += ` · ${pct >= 0 ? '+' : ''}${pct.toFixed(2)}% vs market`;
    }
    $('f-' + key).textContent = foot;
  }
  $('e-visa').hidden = !rates.estimated?.visa;
  fitAll();
}

async function load() {
  const from = fromEl.value, to = toEl.value;
  const id = ++reqId;
  $('results').classList.add('dim');
  try {
    const res = await fetch(`/api/rates?from=${from}&to=${to}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (id !== reqId) return;
    rates = data;
    render(null);
    statusEl.className = '';
    const t = new Date(data.fetchedAt || Date.now()).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    statusEl.textContent = `Updated ${t}` + (data.estimated?.visa ? ' · EST. = Visa rate unavailable, market + typical markup' : '');
  } catch (e) {
    if (id !== reqId) return;
    statusEl.className = 'err';
    statusEl.textContent = rates ? 'Offline – showing last known rates' : 'Could not load rates';
  } finally {
    if (id === reqId) $('results').classList.remove('dim');
  }
}

function onPairChange() {
  store.set('from', fromEl.value);
  store.set('to', toEl.value);
  rates = null;
  for (const k of ['market', 'visa']) { $('v-' + k).value = ''; $('f-' + k).textContent = ''; $('c-' + k).textContent = ''; }
  fitAll();
  load();
}

// --- Editing: any of the three fields can drive the others ---
amountEl.addEventListener('input', () => {
  base = parseNum(amountEl.value);
  store.set('amount', amountEl.value);
  render('amount');
  fitAmountOnly();
});
function fitAmountOnly() { fitInput(amountEl, 64, 22); }

function onResultEdit(el, key) {
  el.addEventListener('input', () => {
    if (!rates) return;
    base = parseNum(el.value) / rates[key === 'market' ? 'market' : 'visa'];
    render(key);
    store.set('amount', amountEl.value);
    fitInput(el, el === marketEl ? Math.min((el.parentElement.clientHeight || 160) * 0.9, 190) : 56, el === marketEl ? 22 : 20);
  });
  el.addEventListener('blur', () => { if (rates) { el.value = fmt2(base * rates[key === 'market' ? 'market' : 'visa']); fitAll(); } });
}
onResultEdit(marketEl, 'market');
onResultEdit(visaEl, 'visa');

for (const el of [amountEl, marketEl, visaEl]) el.addEventListener('focus', () => setTimeout(() => el.select(), 0));

fromEl.addEventListener('change', onPairChange);
toEl.addEventListener('change', onPairChange);
$('swap').addEventListener('click', () => {
  [fromEl.value, toEl.value] = [toEl.value, fromEl.value];
  onPairChange();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
window.addEventListener('resize', fitAll);
window.addEventListener('orientationchange', () => setTimeout(fitAll, 150));
setInterval(() => { if (!document.hidden && document.activeElement !== marketEl && document.activeElement !== visaEl) load(); }, REFRESH_MS);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
fitAll();
load();
</script>
</body>
</html>
